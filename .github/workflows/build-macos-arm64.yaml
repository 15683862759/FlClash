name: build-macos-arm64

# Manual Apple Silicon DMG. The main build.yaml cannot reference `matrix` in a
# job-level if, so workflow_dispatch there fails to parse; this file is the
# path that produces a macOS arm64 package on the fork.

on:
  workflow_dispatch:

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  build:
    name: macOS arm64 DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app || true
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build DMG
        run: dart setup.dart macos ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: List dist
        run: ls -lah ./dist || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-macos-arm64
          path: ./dist
          if-no-files-found: error
